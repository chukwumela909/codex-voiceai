[project]
name = "codex-voiceai"
version = "0.1.0"
description = "Browser-first conversational voice agent MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "websockets>=13.0",
    "pipecat-ai[deepgram,groq,elevenlabs,silero]>=1.2,<2",
    # LocalSmartTurnAnalyzerV3 (app/pipeline.py) — pipecat 1.2 has no extra that
    # covers the v3 ONNX analyzer, so its deps must be listed explicitly or the
    # Docker image ImportErrors on every Pipecat session.
    "onnxruntime>=1.20",
    "soxr>=0.5",
    "transformers>=4.48,<6",
    # MarkdownTextFilter (LLM -> TTS text sanitation).
    "markdown>=3.6",
    # SoundfileMixer (server-side room tone on Pipecat/Twilio output).
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

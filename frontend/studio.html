<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <title>Codex — Personality Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/static/styles.css?v=studio.1" />
  </head>
  <body class="studio-body">
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Codex home">
        <span class="wordmark__mark" aria-hidden="true"></span>
        <span class="wordmark__text">Codex</span>
      </a>
      <div class="topbar__right">
        <span class="caption-uppercase">Personality Studio</span>
        <a class="btn btn--ghost btn--sm" href="/">Back to call</a>
      </div>
    </header>

    <main class="studio">
      <!-- Character list -->
      <section class="studio__list" aria-label="Characters">
        <header class="studio__list-head">
          <p class="caption-uppercase">Characters</p>
          <button id="newBtn" class="btn btn--outline btn--sm" type="button">+ New</button>
        </header>
        <ul id="characterList" class="char-list" aria-live="polite"></ul>
      </section>

      <!-- Editor -->
      <section class="studio__editor" aria-label="Character editor">
        <header class="studio__editor-head">
          <div>
            <h1 class="studio__title" id="editorTitle">Select a character</h1>
            <p class="studio__subtitle" id="editorId">&nbsp;</p>
          </div>
          <div class="studio__editor-actions">
            <button id="duplicateBtn" class="btn btn--ghost btn--sm" type="button" disabled>Duplicate</button>
            <button id="saveBtn" class="btn btn--outline btn--sm" type="submit" form="editorForm" disabled>Save</button>
          </div>
        </header>

        <form id="editorForm" class="editor" autocomplete="off">
          <label class="field">
            <span class="field__label">Name <span class="field__req">*</span></span>
            <input type="text" id="fName" required />
          </label>

          <label class="field">
            <span class="field__label">Role <span class="field__req">*</span></span>
            <textarea id="fRole" rows="2" required></textarea>
          </label>

          <label class="field">
            <span class="field__label">Grammar / speaking style</span>
            <input type="text" id="fGrammar" placeholder="e.g. casual American gen-z english" />
          </label>

          <div class="field" data-list="tone">
            <span class="field__label">Tone</span>
            <div class="list-rows" id="listTone"></div>
            <button type="button" class="btn btn--ghost btn--xs" data-add="tone">+ Add tone</button>
          </div>

          <div class="field" data-list="speaking_style_rules">
            <span class="field__label">Speaking style rules</span>
            <div class="list-rows" id="listRules"></div>
            <button type="button" class="btn btn--ghost btn--xs" data-add="speaking_style_rules">+ Add rule</button>
          </div>

          <div class="field" data-list="forbidden_phrases">
            <span class="field__label">Forbidden phrases</span>
            <div class="list-rows" id="listForbidden"></div>
            <button type="button" class="btn btn--ghost btn--xs" data-add="forbidden_phrases">+ Add phrase</button>
          </div>

          <label class="field">
            <span class="field__label">Identity response style</span>
            <textarea id="fIdentity" rows="2" placeholder="How to deflect &quot;are you an AI?&quot;"></textarea>
          </label>

          <div class="field" data-list="example_exchanges">
            <span class="field__label">Example exchanges</span>
            <div class="list-rows list-rows--pairs" id="listExamples"></div>
            <button type="button" class="btn btn--ghost btn--xs" data-add="example_exchanges">+ Add exchange</button>
          </div>

          <p id="saveStatus" class="editor__status" role="status"></p>
        </form>
      </section>

      <!-- Preview -->
      <aside class="studio__preview" aria-label="Voice preview">
        <p class="caption-uppercase">Voice preview</p>
        <p class="studio__hint">Run the current edits through the LLM + TTS without saving.</p>
        <label class="field">
          <span class="field__label">Test message</span>
          <textarea id="previewMessage" rows="2">Hi, who am I talking to?</textarea>
        </label>
        <button id="previewBtn" class="btn btn--outline btn--sm" type="button" disabled>▶ Preview voice</button>

        <div class="preview-result" id="previewResult" hidden>
          <div class="preview-meta" id="previewMeta"></div>
          <p class="preview-text" id="previewText"></p>
          <ul class="preview-warnings" id="previewWarnings"></ul>
        </div>
      </aside>
    </main>

    <script src="/static/studio.js?v=studio.1"></script>
  </body>
</html>
